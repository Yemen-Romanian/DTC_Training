experiment_name = "synthetic_only_tracker_training"
mlflow_logging = true

[train_path]
    synthetic = ""
    uav123 = ""
    manual = ""

[val_path]
    synthetic = ""
    uav123 = ""
    manual = ""

# Optional: evaluated once at the end of training. Remove section to skip final evaluation.
# [test_path]
#     synthetic = ""
#     uav123 = ""
#     manual = ""

[training_params]
    # Seed for random, numpy and torch. Comment out to draw a fresh one per run; either way
    # the value actually used is logged to MLflow as seed_random/seed_numpy/seed_torch.
    seed = 42
    batch_size = 16
    lr = 0.001
    epochs_num = 20
    evaluation_interval = 3
    data_workers_num = 8

[model]
    id = "siamfc"
    [model.backbone]
        type = "AlexNet" # Options: "AlexNet", "MobileNetV3"
        freeze = false
    [model.params]
        device = "cuda"
